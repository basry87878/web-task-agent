services:
  - type: web
    name: jobtruth-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: GA_API_SECRET
        sync: false
      - key: GEMINI_PRIMARY_MODEL
        value: "gemini-4-hydrogen"
      - key: GEMINI_FALLBACK_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GROQ_FALLBACK_MODEL
        value: "qwen/qwen3.8-27b"
      - key: GROQ_SECONDARY_FALLBACK_MODEL
        value: "openai/gpt-oss-120b"
      - key: MAX_RESEARCH_RUNS_PER_SESSION
        value: "3"
      - key: MAX_COACH_REPLIES_PER_SESSION
        value: "10"
